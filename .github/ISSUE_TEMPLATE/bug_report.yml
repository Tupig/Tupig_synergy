name: Bug report / 缺陷报告
description: Report a defect in TuPig Synergy. 报告 TuPig Synergy 的缺陷。
type: "Triage [bug]"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve TuPig Synergy.
        感谢你花时间帮助改进 TuPig Synergy。

        <b>Before you submit / 提交前</b>
        > [!IMPORTANT]
        > 1. Try the latest [release](https://github.com/Tupig/Tupig_synergy/releases). / 先试最新[发布](https://github.com/Tupig/Tupig_synergy/releases)。
        > 2. Search existing issues and do not file a duplicate. / 先搜索已有 issue，不要重复提交。
        > 3. Use a title that says what fails. / 标题要写明哪里失败。

  - type: checkboxes
    id: sanity-checks
    attributes:
      label: Checks / 确认
      description: Complete this before submitting. 提交前勾选。
      options:
        - label: I tried the latest release, searched existing issues, and the problem remains. 我试过最新发布、搜过已有 issue，问题仍在。
          required: true

  - type: textarea
    id: version
    attributes:
      label: Version / 版本
      description: |
        Help, About, Copy version info. Paste that text only.
        帮助、关于、复制版本信息。只粘贴那段文字。
      placeholder: |
        TuPig Synergy: 1.21.2
        Qt: 6.7.0
        System: Windows 11
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build / 构建来源
      description: Which builds are the server and the clients running? 服务端和客户端各是哪种构建？
      multiple: true
      options:
        - Official release (installer or package from GitHub Releases) / 官方发布（GitHub Releases 的安装包）
        - Community package (apt, dnf, pacman, brew, and similar) / 社区软件包
        - Local build / 本地编译
        - Other / 其他
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Layout / 布局
      description: |
        Which machine is the server, and where the others sit. Operating system details belong in Version.
        哪一台是服务端，其他机器在哪一侧。操作系统写在版本一栏。
      placeholder: |
        - Windows 11 server, Ubuntu client
        - One monitor on each computer
        - Ubuntu is to the left of Windows
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps / 步骤
      description: |
        Numbered steps that reproduce the problem.
        用编号写出能复现问题的步骤。
      placeholder: |
        1. Start TuPig Synergy
        2. Open the server configuration
        3. Apply the change
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log / 日志
      description: |
        Paste the relevant log. It is already inside a code block.
        粘贴相关日志。它已经在代码块里。
      value: |
        <details><summary><h3>Log / 日志</h3></summary>

        ```text

        ```

        </details>

  - type: textarea
    id: additional-info
    attributes:
      label: Anything else / 其他信息
      description: |
        Screenshots, messages, workarounds, or other programs that are running.
        截图、报错、临时办法，或其他正在运行的程序。
