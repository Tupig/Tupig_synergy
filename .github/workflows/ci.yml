# Single workflow, shown as "TuPig Synergy" (CMAKE_PROJECT_PROPER_NAME).
# Jobs are ordered for reading; `needs` is what actually schedules them:
#   1. prepare (version, encoding, clang-format, and the trigger plan below)
#   2. build (Windows MSVC, macOS AppleClang arm64+x86_64, Linux gcc, Flatpak)
#   3. publish (GitHub Release, optional S3, Slack on failure)
#   4. analysis (only workflow_dispatch with analyze=true)
#   5. ci-passed, the branch-protection gate
#
# Triggers — one run does not start another:
#   push to main          lint + free Linux. No publish. A newer push cancels the older one.
#   pull_request to main  same as push. A newer push to that PR cancels the older run.
#   release published     all platforms, clean version, attach packages. This fires when a
#                         person publishes a Release. The publish job uses the workflow
#                         token, and that token does not start a new workflow, so it does
#                         not loop. Do not publish the same commit from the UI and from
#                         workflow_dispatch; those are different refs and both would build.
#   workflow_dispatch     manual. package-type=release ignores platform and publishes.
#                         package-type=snapshot honors platform and does not publish.
#                         analyze is independent of package-type.
#   schedule              every day at 08:23 Asia/Shanghai (cron is UTC: 23 0 * * *).
#                         Same build as package-type=release. If tag v<X.Y.Z> already
#                         records this commit (Built-From, or the tag itself), the
#                         run stops before compile and publish. GitHub still starts
#                         the workflow; the jobs are skipped.
# Push/PR and a manual run use different concurrency groups, so a free Linux
# check cannot cancel a release build that is already going.

name: TuPig Synergy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      package-type:
        description: "release: all platforms, clean version, publish the GitHub Release. snapshot: no publish; platform applies."
        required: false
        default: "release"
        type: choice
        options:
          - release
          - snapshot
      platform:
        description: "snapshot only. blank = all platforms. Ignored when package-type is release."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - windows
          - macos
          - linux
      analyze:
        description: "Also run clang-tidy, cppcheck, CodeQL, SonarCloud and Valgrind. Does not change which platforms build."
        required: false
        default: false
        type: boolean
      aws-s3-uri:
        description: "Optional S3 override for a manual or release run. Unused when AWS secrets are unset."
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # 08:23 Asia/Shanghai (UTC+8). Actions cron is UTC and may start late.
    - cron: "23 0 * * *"

# Automatic runs cancel only their own older run. Manual and release runs
# never cancel, and a push cannot cancel them (separate group).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  PACKAGE_PREFIX: ${{ vars.SYNERGY_PACKAGE_PREFIX || 'synergy' }}
  CMAKE_CONFIGURE: "cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON"

  # Release shape, propagated to cmake (Synergy.cmake reads these as options).
  # Release events, the daily schedule, and package-type=release → clean X.Y.Z.
  # Push to main + package-type=snapshot → snapshot build.
  # Pull requests fall through to the cmake dev default.
  SYNERGY_VERSION_RELEASE: ${{ github.event_name == 'release' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'release') }}
  SYNERGY_VERSION_SNAPSHOT: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.package-type == 'snapshot') }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Prepare. Every event starts here. The plan step records which
  # platforms this event is allowed to build.
  # ---------------------------------------------------------------------------
  get-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      base: ${{ steps.get-version.outputs.base }}
      linux_targets: ${{ steps.plan.outputs.targets }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      build_flatpak: ${{ steps.plan.outputs.build_flatpak }}
      publish_release: ${{ steps.plan.outputs.publish_release }}
      skip_unchanged: ${{ steps.plan.outputs.skip_unchanged }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get-version
        uses: ./.github/actions/get-version

      - name: Check vcpkg version matches Version.cmake
        run: python3 scripts/ci/check-version-consistency.py

      # One place decides what this event builds. Job `if`s only read these
      # outputs, so a platform is not accidentally both required and skipped.
      # push/PR: free Linux. release, the daily schedule, and package-type=release:
      # every platform and a GitHub Release. The schedule skips that when this
      # commit is already on the tag. snapshot: honor platform; blank means all.
      - name: Plan builds for this event
        id: plan
        env:
          PACKAGE_TYPE: ${{ inputs.package-type }}
          PLATFORM: ${{ inputs.platform }}
          VERSION_BASE: ${{ steps.get-version.outputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          linux_key=free
          build_windows=false
          build_macos=false
          build_linux=false
          build_flatpak=false
          publish_release=false
          skip_unchanged=false
          case "$GITHUB_EVENT_NAME" in
            push|pull_request)
              linux_key=free
              build_linux=true
              ;;
            release)
              linux_key=full
              build_windows=true
              build_macos=true
              build_linux=true
              build_flatpak=true
              publish_release=true
              ;;
            schedule)
              linux_key=full
              source_sha=$(git rev-parse HEAD)
              tag="v${VERSION_BASE}"
              published=""
              if body=$(gh release view "$tag" --json body -q .body 2>/dev/null); then
                published=$(printf '%s\n' "$body" | tr -d '\r' | sed -n 's/^Built-From: //p' | head -1 | tr -d '[:space:]')
              fi
              if [ -z "$published" ] && git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null; then
                published=$(git rev-parse "refs/tags/${tag}^{commit}")
              fi
              if [ -n "$published" ] && [ "$published" = "$source_sha" ]; then
                skip_unchanged=true
                echo "schedule: ${tag} already built from ${source_sha}; not compiling"
                {
                  echo "### Schedule skipped"
                  echo "\`${tag}\` already records \`${source_sha}\`. No compile and no publish."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                build_windows=true
                build_macos=true
                build_linux=true
                build_flatpak=true
                publish_release=true
                echo "schedule: ${tag} Built-From ${published:-<none>} differs from ${source_sha}; building release"
                {
                  echo "### Schedule release"
                  echo "\`${tag}\` does not yet record \`${source_sha}\`."
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            workflow_dispatch)
              linux_key=full
              if [ "$PACKAGE_TYPE" = "release" ]; then
                build_windows=true
                build_macos=true
                build_linux=true
                build_flatpak=true
                publish_release=true
              else
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "windows" ]; then
                  build_windows=true
                fi
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "macos" ]; then
                  build_macos=true
                fi
                if [ -z "$PLATFORM" ] || [ "$PLATFORM" = "linux" ]; then
                  build_linux=true
                  build_flatpak=true
                fi
              fi
              ;;
            *)
              echo "::error::unexpected event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          targets=$(jq -c --arg k "$linux_key" '.[$k]' .github/matrices/linux-targets.json)
          {
            echo "targets=$targets"
            echo "build_windows=$build_windows"
            echo "build_macos=$build_macos"
            echo "build_linux=$build_linux"
            echo "build_flatpak=$build_flatpak"
            echo "publish_release=$publish_release"
            echo "skip_unchanged=$skip_unchanged"
          } >> "$GITHUB_OUTPUT"
          echo "plan event=$GITHUB_EVENT_NAME package=${PACKAGE_TYPE:-<none>} platform=${PLATFORM:-<none>} linux_matrix=$linux_key windows=$build_windows macos=$build_macos linux=$build_linux flatpak=$build_flatpak publish=$publish_release skip=$skip_unchanged"

  lint-clang:
    needs: get-version
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Clang-format
        uses: ./.github/actions/lint-clang

  # Reads scripts/ci/encoding-check.json. on_violation defaults to fail, so a
  # bad file stops the build jobs. Set it to warn to print and continue.
  lint-encoding:
    needs: get-version
    if: needs.get-version.outputs.skip_unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check source encoding
        run: python3 scripts/ci/check-encoding.py

  # ---------------------------------------------------------------------------
  # 2. Build. One CMake configure line per OS; the runner compiler differs.
  # Windows: MSVC + Ninja. macOS: AppleClang (arm64 and x86_64). Linux: gcc.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_windows == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    env:
      # SignPath Foundation holds the code-signing key. The API token is the only
      # secret. Organization id and project slug are Actions variables assigned
      # after the project is approved. Missing any of them leaves the package unsigned.
      WINDOWS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "windows-2022-x64"
            runs-on: "windows-2022"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.10.3

          - name: "windows-2022-arm64"
            runs-on: "windows-11-arm"
            vcpkg-triplet: arm64-windows
            arch: "arm64"
            qt-version: 6.11.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain. vcvars via setup-msvc-dev; Qt from the CI Qt build, OpenSSL from vcpkg.
      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      - name: Update Windows Paths
        shell: cmd
        run: |
          set "DOXYGEN_BIN=C:\Program Files\doxygen\bin"
          echo %DOXYGEN_BIN%>>"%GITHUB_PATH%"

      # Stage: compile. GUI must be synergy_<X.Y.Z>.exe; core and daemon stay unversioned.
      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} -G Ninja ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      # Iron rule: the GUI file is synergy_<X.Y.Z>.exe. X.Y.Z is get-version's
      # base, which SaveVersion.cmake reads from Version.cmake. core and daemon
      # stay unversioned so the GUI can still launch them.
      - name: Require synergy_<version>.exe
        id: gui-exe
        shell: bash
        run: |
          set -euo pipefail
          base="${{ needs.get-version.outputs.base }}"
          ver="${{ needs.get-version.outputs.version }}"
          if [ "$ver" != "$base" ]; then
            echo "::error::release version must be ${base}, got ${ver}"
            exit 1
          fi
          count=$(find build/bin -type f -name "synergy_${base}.exe" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one synergy_${base}.exe, found ${count}"
            find build/bin -type f -name '*.exe' || true
            exit 1
          fi
          exe=$(find build/bin -type f -name "synergy_${base}.exe")
          dir=$(dirname "$exe")
          test -f "$dir/synergy-core.exe"
          test -f "$dir/synergy-daemon.exe"
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          echo "GUI exe: $exe"

      # Stage: sign executables before WiX embeds them. Skipped until the
      # SignPath Foundation project is approved and the Actions secret and
      # variables exist. The package is still produced, unsigned.
      - name: Windows signing not configured
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING != 'true'
        shell: bash
        run: echo "::warning::Windows code signing skipped. Apply at https://signpath.org/ and set SIGNPATH_API_TOKEN plus SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG. Artifacts from this run are unsigned."

      - name: Stage binaries for signing
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat stage

      - name: Upload unsigned executables
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-exes
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-signpath-exes-${{ matrix.target.name }}
          path: ${{ runner.temp }}\sign-stage\in\*.exe
          retention-days: 1
          if-no-files-found: error

      - name: Sign executables with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: sign-exes
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-executables
          github-artifact-id: ${{ steps.upload-unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\out

      - name: Restore + verify signed binaries
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat restore

      - name: Upload synergy_<version>.exe
        uses: actions/upload-artifact@v7
        with:
          name: synergy_${{ needs.get-version.outputs.base }}.exe
          path: ${{ steps.gui-exe.outputs.path }}
          if-no-files-found: error

      # Stage: package, then sign the MSI itself when signing is enabled.
      - name: Package
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Locate MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: locate-msi
        shell: cmd
        run: scripts\ci\ci-windows-signing.bat locate-msi

      - name: Upload unsigned MSI
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-signpath-msi-${{ matrix.target.name }}
          path: ${{ steps.locate-msi.outputs.path }}
          archive: false
          retention-days: 1
          if-no-files-found: error

      - name: Sign MSI with SignPath Foundation
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-msi
          github-artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: ${{ runner.temp }}\sign-stage\msi
          skip-decompress: true

      - name: Replace MSI with the signed file
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
          SIGNED_MSI_DIR: ${{ runner.temp }}\sign-stage\msi
        run: scripts\ci\ci-windows-signing.bat replace-msi

      - name: Verify MSI is signed
        if: env.SYNERGY_VERSION_RELEASE == 'true' && env.WINDOWS_SIGNING == 'true'
        shell: cmd
        env:
          MSI_PATH: ${{ steps.locate-msi.outputs.path }}
        run: scripts\ci\ci-windows-signing.bat verify-msi

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-macos:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_macos == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: ${{ matrix.target.timeout }}

    env:
      MAC_SIGNING: ${{ secrets.APPLE_CODESIGN_ID != '' }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "macos-arm64"
            runs-on: macos-15
            timeout: 10
            qt-version: 6.11.1
            # Deployment target is set once in cmake/Synergy.cmake (single
            # source of truth); don't pass -DCMAKE_OSX_DEPLOYMENT_TARGET here.
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64"'

          - name: "macos-x64"
            runs-on: macos-15-intel
            timeout: 20
            qt-version: 6.9.3
            config-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64"'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage: toolchain, then compile. Qt comes from the CI Qt build.
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }} -DAPPLE_CODESIGN_ID="${{ secrets.APPLE_CODESIGN_ID }}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      # Stage: sign and notarize, only when APPLE_CODESIGN_ID is set.
      # Create an ephemeral keychain just for this run and import the Developer
      # ID Application certificate from the base64-encoded P12 in secrets. Using
      # a per-run keychain (rather than System.keychain) keeps the cert out of
      # any shared state on the runner; the keychain is destroyed at job end.
      # set-key-partition-list grants codesign passwordless access so the later
      # sign step doesn't prompt.
      - name: Set up signing keychain
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_P12_CERTIFICATE: ${{ secrets.APPLE_P12_CERTIFICATE }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_pass=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d ' "')
          cert_file="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_P12_CERTIFICATE" | base64 --decode > "$cert_file"
          security import "$cert_file" -k "$keychain" -P "$APPLE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
          rm -f "$cert_file"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASS=$keychain_pass" >> "$GITHUB_ENV"

      # CPack runs macdeployqt and, when a Developer ID is configured, codesigns
      # the bundle that gets embedded in the DMG (see deploy/mac/deploy.cmake), so
      # the keychain must be unlocked first. CPack on macOS is flaky; retry a
      # handful of times before failing.
      - name: Package
        shell: bash
        run: |
          if [ -n "$SIGN_KEYCHAIN" ]; then
            security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          fi
          for i in $(seq 1 5); do
            if cmake --build build --config Release -j8 --target package 2>&1; then
              echo "Package successful"
              exit 0
            fi
            echo "Package attempt $i failed"
            sleep 1
          done
          echo "ERROR: package failed after 5 attempts" >&2
          exit 1

      # Sign the DMG itself so Gatekeeper trusts it before extraction. Then
      # submit to notarytool (synchronous via --wait) and staple the returned
      # ticket so Gatekeeper can verify offline.
      - name: Sign + notarize + staple DMG
        if: env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CODESIGN_ID: ${{ secrets.APPLE_CODESIGN_ID }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(find build -maxdepth 2 -name "*.dmg" -type f | head -n1)
          if [ -z "$dmg" ]; then
            echo "ERROR: no DMG found under build/" >&2
            find build -maxdepth 2 -name "*.dmg" 2>/dev/null
            exit 1
          fi
          echo "Found DMG: $dmg"

          security unlock-keychain -p "$SIGN_KEYCHAIN_PASS" "$SIGN_KEYCHAIN"
          /usr/bin/codesign --force --timestamp --sign "$APPLE_CODESIGN_ID" "$dmg"

          result=$(xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_NOTARY_USER" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json --wait)
          echo "$result"
          id=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          status=$(echo "$result" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "Notarization $status; per-file detail follows:" >&2
            xcrun notarytool log "$id" \
              --apple-id "$APPLE_NOTARY_USER" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"
          echo "DMG signed + notarized + stapled: $dmg"

      # Stage: test the build and the package, then upload it.
      - name: Unit tests
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-linux:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_linux == 'true' }}
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    container: ${{ matrix.target.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # free or full, chosen by the plan step in get-version.
        target: ${{ fromJSON(needs.get-version.outputs.linux_targets) }}

    steps:
      # Stage: container toolchain. The image has no git, and it runs as root.
      # Containers don't ship git; everything else needs it for checkout + describe.
      # This pre-checkout step runs at the workspace root, which always exists.
      - name: Install Git on Container
        shell: bash
        run: |
          if [ "${{ matrix.target.like }}" == "debian" ]; then
            apt update -qqq > /dev/null && apt install -qqq git devscripts > /dev/null
          elif [ "${{ matrix.target.like }}" == "fedora" ]; then
            dnf install -y git
          elif [ "${{ matrix.target.like }}" == "suse" ]; then
            zypper refresh
            zypper install -y --force-resolution git
          elif [ "${{ matrix.target.like }}" == "arch" ]; then
            pacman -Syu --noconfirm git
          elif [ "${{ matrix.target.like }}" == "rhel" ]; then
            dnf install -y git
          else
            echo "Unknown: ${{ matrix.target.like }}"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      # The container runs as root over a host-owned workspace, so git rejects it as
      # dubious-owned and the Configure step's `git describe` degrades the rev count
      # to 0, naming packages +r0 while non-container builds use the real count.
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: ${{ matrix.target.like }}

      # 24.04's system libportal (0.7.x) lacks the input-capture portal the code needs
      # (>= 0.8.0), and that LTS's libs are frozen. Build a newer libportal and static-link
      # it so the shipped binary carries no runtime dependency on a >= 0.8 system libportal
      # (libei from the system is fine). The code uses no xdp_parent, so no GUI backend is
      # needed, and removing the system .so makes `-lportal` resolve to the static archive.
      - name: Build newer libportal (Ubuntu 24.04)
        if: startsWith(matrix.target.name, 'ubuntu-24.04')
        shell: bash
        run: |
          apt-get install -y -qq meson pkg-config
          git clone --depth 1 --branch 0.9.1 https://github.com/flatpak/libportal.git /tmp/libportal
          meson setup /tmp/libportal/_build /tmp/libportal --prefix=/usr --libdir=lib/$(gcc -dumpmachine) \
            --default-library=static \
            -Dbackend-gtk3=disabled -Dbackend-gtk4=disabled -Dbackend-qt5=disabled -Dbackend-qt6=disabled \
            -Ddocs=false -Dintrospection=false -Dvapi=false -Dtests=false
          meson install -C /tmp/libportal/_build
          rm -f /usr/lib/$(gcc -dumpmachine)/libportal.so*
          ldconfig

      # Stage: compile and package. Arch uses makepkg; every other distro uses CPack.
      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} ${{ matrix.target.config-args }} -DSYNERGY_VERSION_RELEASE=${{ env.SYNERGY_VERSION_RELEASE }} -DSYNERGY_VERSION_SNAPSHOT=${{ env.SYNERGY_VERSION_SNAPSHOT }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8

      - name: Package
        shell: bash
        run: |
          if [[ "${{ matrix.target.like }}" == "arch" ]]; then
            useradd -m build
            sudo chown -R build build
            cd build
            sudo -u build makepkg -s
            export OSNAME=$(cat /etc/os-release | grep ^ID= | sed 's/ID=//g')
            [ "$OSNAME" = "arch" ] && OSNAME="arch-linux"
            export ARCH=$(uname -m)
            mv *.pkg.tar.zst ${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_${OSNAME}_${ARCH}.pkg.tar.zst
            cd ..
          else
            cmake --build build --config Release -j8 --target package
          fi

      # Stage: test, then upload. RHEL skips the unit tests (Qt5 leg).
      - name: Unit tests
        if: ${{ matrix.target.like != 'rhel' }}
        uses: ./.github/actions/run-tests
        timeout-minutes: 2

      - name: Test packaged build
        uses: ./.github/actions/test-package
        with:
          like: ${{ matrix.target.like }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/${{ env.PACKAGE_PREFIX }}[-_]*.*
          retention-days: 14

  build-flatpak:
    needs: [lint-encoding, lint-clang, get-version]
    if: ${{ needs.get-version.outputs.build_flatpak == 'true' }}
    name: flatpak-${{matrix.flatpak.arch}}
    runs-on: ${{matrix.flatpak.runs-on}}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        flatpak:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: git config --global protocol.file.allow always

      # Stage: lint the metadata, build the bundle, then upload it.
      - name: Lint AppStream
        run: flatpak-builder-lint appstream deploy/linux/com.tupig.synergy.metainfo.xml

      # appid-url-not-reachable: the linter probes https://tupig.com (app-id
      # namespace), which fails TLS from CI — same class as A-39 (#63). Covered by
      # ci-build-lint-exceptions.json; without --exceptions this step hard-fails.
      - name: Lint manifest
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json manifest deploy/linux/flatpak/com.tupig.synergy.yml

      # uses: steps resolve relative paths from GITHUB_WORKSPACE (the repo root).
      # The builder reads the manifest from deploy/ and writes repo/,
      # .flatpak-builder/ and the bundle at the workspace root; Validate/Upload
      # must anchor there too.
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.PACKAGE_PREFIX }}_${{ needs.get-version.outputs.version }}_linux_${{ matrix.flatpak.arch }}.flatpak
          manifest-path: deploy/linux/flatpak/com.tupig.synergy.yml
          cache-key: flatpak-builder-${{matrix.flatpak.arch}}-2.0
          arch: ${{matrix.flatpak.arch}}
          upload-artifact: false

      - name: Validate build
        run: flatpak-builder-lint --exceptions --user-exceptions deploy/linux/flatpak/ci-build-lint-exceptions.json repo repo

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ env.PACKAGE_PREFIX }}-${{ needs.get-version.outputs.version }}-flatpak-${{matrix.flatpak.arch}}
          path: ${{github.workspace}}/${{ env.PACKAGE_PREFIX }}[-_]*.flatpak
          retention-days: 14

  # Attach the CPack/Flatpak packages to the GitHub Release v<X.Y.Z>. Actions
  # artifacts expire; the Release page is what people download. Push and PR
  # skip this job. A failed distro does not drop packages that did build.
  # ---------------------------------------------------------------------------
  # 3. Publish. Release builds attach packages to the GitHub Release and,
  # when AWS secrets exist, copy them to S3. report runs only after a failure.
  # ---------------------------------------------------------------------------
  github-release:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    if: ${{ always() && needs.get-version.result == 'success' && needs.get-version.outputs.publish_release == 'true' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success' || needs.build-flatpak.result == 'success') }}
    runs-on: ubuntu-latest
    # contents:write uploads the Release. id-token and attestations mint the
    # Sigstore provenance for those same bytes. Job permissions replace the
    # workflow default, so contents:write has to stay on this list.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Hash release packages
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to attest"
            exit 1
          fi
          sha256sum "${files[@]}" > "$RUNNER_TEMP/release-subjects.txt"
          echo "path=$RUNNER_TEMP/release-subjects.txt" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ steps.subjects.outputs.path }}

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repo. Without GH_REPO, gh tries
          # to run git and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.get-version.outputs.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          mapfile -t files < <(find dist -type f ! -name '*.digest' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no package files to publish"
            exit 1
          fi
          printf 'Publishing %s files to v%s\n' "${#files[@]}" "$VERSION"
          printf ' - %s\n' "${files[@]}"
          tag="v${VERSION}"
          title="TuPig Synergy ${VERSION}"
          notes="Packages for ${VERSION}."$'\n\n'"Each package file from this workflow has a GitHub build-provenance attestation. Verify a downloaded file with: gh attestation verify FILE --repo Tupig/Tupig_synergy"$'\n\n'"Windows builds are Authenticode-signed by SignPath Foundation when that project is approved. Until then they are unsigned. Provenance shows which workflow and commit produced the file. It is not itself an Authenticode or Apple signature."
          marker="Built-From: ${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            existing=$(gh release view "$tag" --json body -q .body)
            cleaned=$(printf '%s\n' "$existing" | tr -d '\r' | grep -v '^Built-From: ' || true)
            if [ -z "${cleaned//[[:space:]]/}" ]; then
              cleaned="$notes"
            fi
            gh release edit "$tag" --notes "${cleaned}"$'\n\n'"${marker}"
          else
            gh release create "$tag" "${files[@]}" --title "$title" --notes "${notes}"$'\n\n'"${marker}" --latest
          fi

  # Upload all packages that built to AWS S3 for distribution. Runs after the
  # build jobs on push/dispatch/release events (PRs skipped, no secrets), and
  # uploads whatever artifacts exist — one failed target must not block shipping
  # the rest (a flaky distro shouldn't sink a whole nightly snapshot). Gated only
  # on get-version, which supplies the path. Layout: <dir>/<dev|snapshot|release>/<version>/...
  # No checkout (download-artifact only). Artifacts land at the workspace root under dist/.
  # Secrets cannot be referenced from a job-level `if` (context unavailable
  # there), so gate each AWS step individually: when secrets are unset the
  # job still runs but every upload step is skipped - job stays green (A-30 (#54)).
  s3-upload:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak]
    # Free tier: no push auto-upload; snapshot S3 only via release / manual dispatch.
    if: ${{ always() && needs.get-version.result == 'success' && needs.get-version.outputs.skip_unchanged != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check AWS secrets
        id: aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "AWS secrets not configured; skipping S3 upload."
          fi

      - name: Download all artifacts
        if: steps.aws.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload to AWS S3
        if: steps.aws.outputs.configured == 'true'
        shell: bash
        run: |
          version="${{ needs.get-version.outputs.version }}"
          s3_uri="${{ inputs.aws-s3-uri || format('s3://{0}/{1}', vars.AWS_S3_BUCKET, vars.AWS_S3_UPLOAD_DIR) }}"
          s3_uri="${s3_uri%/}"

          if [[ "${{ env.SYNERGY_VERSION_RELEASE }}" == "true" ]]; then
            sub_dir="release"
          elif [[ "${{ env.SYNERGY_VERSION_SNAPSHOT }}" == "true" ]]; then
            # Group snapshots by base version, keeping the stage so the folder
            # matches the release path (i.e. 1.21.2-beta/1.21.2-beta-snapshot+r42).
            base_version="${version%%-snapshot*}"
            sub_dir="snapshot/$base_version"
          else
            sub_dir="dev"
          fi

          url="$s3_uri/$sub_dir/$version"
          echo "Uploading to AWS S3: $url"
          aws s3 cp ./dist/ "$url" --recursive

  report:
    needs: [get-version, build-windows, build-macos, build-linux, build-flatpak, s3-upload]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Build Slack message
        id: message
        shell: bash
        run: |
          link="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "text<<EOF"
            echo "<!channel>"
            echo "❌ Synergy CI failed"
            [ "${{ needs.build-windows.result }}" = "failure" ] && echo "• Windows build failed"
            [ "${{ needs.build-macos.result }}" = "failure" ] && echo "• macOS build failed"
            [ "${{ needs.build-linux.result }}" = "failure" ] && echo "• Linux build failed"
            [ "${{ needs.build-flatpak.result }}" = "failure" ] && echo "• Flatpak build failed"
            [ "${{ needs.s3-upload.result }}" = "failure" ] && echo "• S3 upload failed"
            echo "<$link|View workflow>"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Check Slack secrets
        id: slack
        shell: bash
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}
        run: |
          if [ -n "$SLACK_TOKEN" ] && [ -n "$SLACK_CHANNEL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Slack secrets not configured; skipping notification."
          fi

      - name: Send Slack notification
        if: steps.slack.outputs.configured == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_NOTIFY_CHANNEL_ID }}
            text: ${{ toJSON(steps.message.outputs.text) }}

  # ---------------------------------------------------------------------------
  # 4. Analysis. Manual dispatch with analyze=true only. Push and pull
  # requests skip this whole group. Valgrind is the expensive container build.
  # ---------------------------------------------------------------------------
  clang-tidy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy cmake ninja-build g++ \
            libx11-dev libxi-dev libxtst-dev libxinerama-dev libxrandr-dev \
            libxkbcommon-dev libglib2.0-dev libssl-dev \
            libgl1-mesa-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: "6.9.3"
          cache: true
      - name: Generate compile commands
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSKIP_BUILD_TESTS=ON
      - name: Run clang-tidy (errors only)
        run: |
          set -euo pipefail
          find src/ -regex '.*\.\(cpp\|cc\|cxx\)' \
            | xargs clang-tidy -p build \
              --checks='-*,bugprone-*,cert-*,cppcoreguidelines-*,clang-analyzer-*,-modernize-use-trailing-return-type' \
              --warnings-as-errors='*' \
            2>&1 | tee clang-tidy-output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-results
          path: clang-tidy-output.txt
          if-no-files-found: ignore

  cppcheck:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            --error-exitcode=1 \
            --output-file=cppcheck-results.txt \
            --language=c++ \
            src/
          cat cppcheck-results.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-results
          path: cppcheck-results.txt
          if-no-files-found: ignore

  codeql:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20
    steps:
      - name: Install container dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual
      - name: Build for CodeQL
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sonar:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze && vars.SONAR_SCANNER_ENABLED }}
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20
    env:
      CPU_CORE_COUNT: 4
    steps:
      - name: Install container dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git curl unzip gcovr dirmngr gpg > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install project dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v6
      - name: Configure
        run: |
          cmake -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE="Debug" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSKIP_BUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON
      - name: Build
        run: |
          build-wrapper-linux-x86-64 --out-dir bw-output cmake --build build -j${CPU_CORE_COUNT}
      - name: Test coverage
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          tests=(`cmake --build build  --target help | grep -o "^coverage-[^:]*"`)
          for i in "${tests[@]}"; do
            cmake --build build --target "$i"
          done
      - name: Get coverage report paths
        id: coverage-paths
        run: |
          paths=$(ls -w 0 -m build/coverage-*.xml | sed 's/ //g')
          if [ -z "$paths" ]; then
            echo "Error: No coverage files found"
            exit 1
          fi
          echo "csv=$paths" >> $GITHUB_OUTPUT
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dproject.settings=config/sonar-project.properties
            -Dsonar.coverageReportPaths=${{ steps.coverage-paths.outputs.csv }}
            -Dsonar.cfamily.threads=${{ env.CPU_CORE_COUNT }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  valgrind:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze }}
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 30
    steps:
      - name: Install container dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git valgrind > /dev/null
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"
      - name: Configure
        run: cmake -B build -G "Ninja"
      - name: Build
        run: cmake --build build -j8
      - name: Valgrind unit tests
        id: unittests
        uses: ./.github/actions/run-valgrind
        with:
          executable: ctest --test-dir  "build/src/unittests"
      - name: Set job summary
        run: |
          backticks='```'
          message=$(cat <<EOF
          ## Valgrind summary

          ### Unit tests
          $backticks
          ${{ steps.unittests.outputs.summary }}
          $backticks
          EOF
          )
          echo "$message" >> $GITHUB_STEP_SUMMARY
  # ---------------------------------------------------------------------------
  # 5. Gate. Branch protection watches this job. A skipped job counts as
  # success: platform filters and analyze=false skip work on purpose.
  # ---------------------------------------------------------------------------
  ci-passed:
    runs-on: ubuntu-latest
    needs:
      [
        get-version,
        lint-clang,
        lint-encoding,
        build-windows,
        build-macos,
        build-linux,
        build-flatpak,
        github-release,
        clang-tidy,
        cppcheck,
        codeql,
        sonar,
        valgrind,
      ]
    if: always()

    steps:
      # 'skipped' is treated as passing because the plan step skips platforms
      # on purpose (push/PR skip Windows, macOS and Flatpak; snapshot honors
      # platform; the daily schedule skips everything when the commit is already
      # published). package-type=release and a published Release do not skip a
      # platform. A failed job is still a failure. get-version never filters
      # out, so requiring it catches a build skipped by its failure.
      # lint-clang and lint-encoding have no platform filter: a failed lint used
      # to be invisible here (builds skip via needs:, skipped counted as ok).
      # Always require both. No checkout: this job only inspects needs.* results.
      - name: Check all jobs passed or were intentionally skipped
        run: |
          ok() {
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }
          if ok "${{needs.get-version.result}}" \
