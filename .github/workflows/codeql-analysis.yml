name: "CodeQL Analysis"

# This is best run as a standalone workflow, not as part of another workflow like CI
# because of how GitHub understands the code scanning workflows in it's UI.
#
# Free tier: private-repo code scanning requires GitHub Advanced Security (paid).
# Auto push/PR triggers are disabled; run manually only if GHAS is enabled.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml for why the work is anchored in the `synergy/` subdirectory.
defaults:
  run:
    working-directory: synergy

jobs:
  codeql:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20

    steps:
      # Pre-checkout: synergy/ does not exist yet; override workflow cwd or
      # the container fails chdir before Fancy Checkout runs.
      - name: Install container dependencies
        working-directory: .
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git > /dev/null

      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      # Autobuild fails at the repo root: two sibling projects (GitHubDesktop2Chinese
      # and synergy) both look like build systems, so the autobuilder refuses to
      # pick one. Build the actual project explicitly from synergy/.
      - name: Build for CodeQL
        working-directory: synergy
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
