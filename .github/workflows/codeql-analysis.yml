name: "CodeQL Analysis"

# This is best run as a standalone workflow, not as part of another workflow like CI
# because of how GitHub understands the code scanning workflows in it's UI.
#
# Free tier: private-repo code scanning requires GitHub Advanced Security (paid).
# Auto push/PR triggers are disabled; run manually only if GHAS is enabled.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20

    steps:
      # Pre-checkout: the workspace root always exists; keep the container from
      # chdir-ing into a directory that is not there yet.
      - name: Install container dependencies
        working-directory: .
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git > /dev/null

      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          build-mode: manual

      # Build the project explicitly for CodeQL instead of relying on autobuild,
      # so the analysis targets the actual build commands.
      - name: Build for CodeQL
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSKIP_BUILD_TESTS=ON
          cmake --build build -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
