name: "CodeQL Analysis"

# This is best run as a standalone workflow, not as part of another workflow like CI
# because of how GitHub understands the code scanning workflows in it's UI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/codeql-analysis.yml'
      - 'synergy/cmake/Libraries.cmake'
      - 'synergy/CMakeLists.txt'
      - 'synergy/src/**'
      - '!synergy/src/apps/res/**'
      - '!synergy/src/unittests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql-analysis.yml'
      - 'synergy/cmake/Libraries.cmake'
      - 'synergy/CMakeLists.txt'
      - 'synergy/src/**'
      - '!synergy/src/apps/res/**'
      - '!synergy/src/unittests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml for why the work is anchored in the `synergy/` subdirectory.
defaults:
  run:
    working-directory: synergy

jobs:
  codeql:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 20

    steps:
      - name: Install container dependencies
        run: |
          apt update -qqq > /dev/null
          apt install -qqq git > /dev/null

      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          like: "debian"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
