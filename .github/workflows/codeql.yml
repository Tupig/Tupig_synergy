# Default CodeQL scan for the Security tab. Separate from the analyze=true
# CodeQL job in ci.yml, which builds with CMake by hand inside Debian.
# Triggers stay: push and pull request to main, plus Monday 00:00 UTC.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: actions/codeql-action/init@v3
        with:
          languages: cpp

      - name: Autobuild
        uses: actions/codeql-action/autobuild@v3

      - name: Analyze
        uses: actions/codeql-action/analyze@v3