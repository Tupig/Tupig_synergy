name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/codeql-action/init@v3
        with:
          languages: cpp
      - uses: actions/codeql-action/autobuild@v3
      - uses: actions/codeql-action/analyze@v3