# Dependency audit for the versions locked by vcpkg.json's builtin-baseline.
#
# Why not osv-scanner: vcpkg dependencies are upstream C/C++ libraries, and
# osv-scanner filters their pkg:generic purls as local/unscannable (verified
# 2026-10-14, osv-scanner v2.7.0). cve-bin-tool reads a CycloneDX SBOM and
# matches NVD version ranges for C/C++ products (zlib, openssl, curl, qt,
# ...), which is the mechanism this workflow uses. See issues #254 and #302.
#
# Pipeline:
#   1. bootstrap the repository-local vcpkg at the pinned baseline
#   2. resolve every locked package with `vcpkg install --dry-run`
#   3. convert the plan into a CycloneDX SBOM (uploaded as an artifact)
#   4. self-test: scan a fixture SBOM with a known vulnerable version, so a
#      silently broken scan fails the job instead of passing empty
#   5. scan the real SBOM and gate on the report
#
# Policy: findings at CRITICAL severity fail the job; HIGH and below are kept
# in the JSON report artifact and the job log. Accepted false positives are
# listed with a written reason in scripts/ci/cve-exceptions.json and filtered
# by the gate; that file is re-reviewed on every vcpkg baseline bump.
#
# Data sources: only NVD is kept. GAD/REDHAT/EPSS/CURL carry distro or exploit
# metadata this gate does not consume, and OSV downloads a multi-GB all.zip
# that repeatedly outlived the hosted runners (cancelled mid-download at
# ~20-30 min, three attempts on 2026-10-14). NVD version ranges cover the
# C/C++ packages in the manifest, which is what the SBOM lists.
#
# Tool version: cve-bin-tool is pinned to a git commit, NOT PyPI. PyPI 3.4 is
# the newest release and still scrapes the NVD 1.1 mirror path
# (mirror.cveb.in/nvd/json/cve/1.1), whose directory is now empty because NVD
# retired the 1.1 feeds; that path yields zero .meta links and an empty
# database (observed 2026-10-14). Only git main speaks the 2.0 mirror
# (cveb.in/get/nvd/json/cve/2.0). Re-evaluate the pin when PyPI 3.5 ships.
#
# Data sources: only NVD is kept. GAD/REDHAT/EPSS/CURL carry distro or exploit
# metadata this gate does not consume, and OSV downloads a multi-GB all.zip
# that repeatedly outlived the hosted runners (cancelled mid-download at
# ~20-30 min, three attempts on 2026-10-14). NVD version ranges cover the
# C/C++ packages in the manifest, which is what the SBOM lists.
#
# NVD transport: the json-mirror feed (cveb.in) drives the scanner through
# cve-bin-tool's async client; the reachability diagnostic step records
# whether that feed answers the runner, because an unreachable mirror
# silently yields an empty database (CVEDataMissing) instead of an error.
#
# CI-only tooling: cve-bin-tool is installed from pip here, in the same
# category as the apt packages and GitHub actions the CI already uses. It is
# not part of the release build or the vcpkg manifest.

name: Dependency Audit

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vcpkg.json
      - scripts/ci/generate-vcpkg-sbom.py
      - scripts/ci/check-cve-report.py
      - .github/workflows/dependency-audit.yml
  pull_request:
    branches: [main]
    paths:
      - vcpkg.json
      - scripts/ci/generate-vcpkg-sbom.py
      - scripts/ci/check-cve-report.py
      - .github/workflows/dependency-audit.yml
  schedule:
    # Mondays 09:17 Asia/Shanghai (UTC+8). Actions cron is UTC and may start late.
    - cron: "17 1 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # cve-bin-tool exits 1 when any CVE is found; the gate step decides instead.
  NO_EXIT_CVE_NUM: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap vcpkg at the pinned baseline
        run: ./scripts/bootstrap-vcpkg.sh

      - name: Resolve locked dependency versions (dry run)
        run: |
          ./vendor/vcpkg/vcpkg install --dry-run --triplet=x64-linux | tee vcpkg-plan.txt
          grep -q "@" vcpkg-plan.txt

      - name: Generate CycloneDX SBOM
        run: python3 scripts/ci/generate-vcpkg-sbom.py vcpkg-plan.txt synergy-deps.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sbom
          path: synergy-deps.cdx.json
          if-no-files-found: error

      - name: Cache cve-bin-tool data
        uses: actions/cache@v5
        with:
          path: ~/.cache/cve-bin-tool
          key: cve-bin-tool-data-${{ github.run_id }}
          restore-keys: |
            cve-bin-tool-data-

      - name: Install cve-bin-tool
        run: python3 -m pip install --disable-pip-version-check "git+https://github.com/intel/cve-bin-tool@b3176d820559d7ec30bd7a99b62cf0535fc16e00"

      - name: Check NVD mirror reachability
        run: |
          curl -sSL -o mirror-index.html -w "cveb.in 2.0 index: HTTP %{http_code} size=%{size_download}\n" https://cveb.in/get/nvd/json/cve/2.0 || true
          echo "meta links: $(grep -c '\.meta' mirror-index.html || true)"

      - name: Self-test with a known vulnerable fixture
        run: |
          cve-bin-tool --disable-version-check -n json-mirror \
            --disable-data-source GAD,REDHAT,EPSS,CURL,OSV \
            --sbom cyclonedx --sbom-file scripts/ci/testdata/known-vulnerable.cdx.json \
            --format json2 --output-file selftest-report.json
          python3 scripts/ci/check-cve-report.py selftest-report.json \
            --expect-any CVE-2016-9840,CVE-2016-9841,CVE-2016-9842,CVE-2016-9843

      - name: Scan the resolved dependency SBOM
        run: |
          cve-bin-tool --disable-version-check -n json-mirror \
            --disable-data-source GAD,REDHAT,EPSS,CURL,OSV \
            --sbom cyclonedx --sbom-file synergy-deps.cdx.json \
            --format json2 --output-file cve-report.json
          test -s cve-report.json

      - name: Upload CVE report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cve-report
          path: cve-report.json
          if-no-files-found: warn

      - name: Gate on critical findings
        if: always()
        run: python3 scripts/ci/check-cve-report.py cve-report.json --fail-severity critical --exceptions scripts/ci/cve-exceptions.json
