# GitHubDesktop2Chinese 自动维护工作流
# 定时检测 GitHub Desktop 新版本，对 localization.json 执行失效检测 + 未翻译候选提取，
# 若失效项或候选有变化则自动创建/更新 Issue 提醒维护者（不直接改 localization.json，避免破坏映射）。

name: GitHubDesktop2Chinese Auto Maintain

on:
  schedule:
    - cron: "0 4 * * *" # 每天 04:00 UTC
  workflow_dispatch: # 手动触发
  push:
    paths:
      - "GitHubDesktop2Chinese/json/localization.json"
      - "GitHubDesktop2Chinese/tools/auto-maintain/**"
    branches: [main]

concurrency:
  group: ghdesktop2chinese-auto-maintain
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  TOOLS_DIR: GitHubDesktop2Chinese/tools/auto-maintain
  WORK_DIR: /tmp/ghdesktop-auto-maintain

jobs:
  auto-maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装解压工具
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: 查询 GitHub Desktop 最新版本
        id: version
        working-directory: ${{ env.TOOLS_DIR }}
        run: |
          LATEST=$(node -e "import('./src/fetch.js').then(async m=>{const r=await m.getLatestRelease();console.log(r.version)})")
          echo "ghdesktop_version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "查询到 GitHub Desktop 最新版本: $LATEST"

      # 缓存已下载的 GitHub Desktop zip（约 328MB），key 绑定版本号，发新版时自动失效
      - name: 缓存 GitHub Desktop release zip
        id: cache-zip
        uses: actions/cache@v4
        with:
          path: ${{ env.WORK_DIR }}/github-desktop.zip
          key: ghdesktop-${{ steps.version.outputs.ghdesktop_version }}-${{ runner.os }}

      - name: 运行失效检测 + 未翻译候选提取
        id: scan
        working-directory: ${{ env.TOOLS_DIR }}
        run: |
          node src/index.js check extract \
            --workdir "$WORK_DIR" \
            --top 100 \
            --write-report

      - name: 创建或更新自动维护 Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.join(process.env.WORK_DIR, 'report.md');
            const report = fs.readFileSync(reportPath, 'utf8');

            // 从报告中提取失效项数量
            const failedMatch = report.match(/总映射项\s+(\d+)，有效\s+(\d+)，失效\s+(\d+)。/);
            const total = failedMatch ? failedMatch[1] : '?';
            const ok = failedMatch ? failedMatch[2] : '?';
            const failed = failedMatch ? failedMatch[3] : '?';

            // 失效项为 0 且无候选时，不创建打扰性 Issue
            const noFailures = Number(failed) === 0;

            const title = `[自动维护] 汉化映射失效 ${failed} 项 / 未翻译候选 (GitHub Desktop 报告)`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `## 自动维护报告（${today}）`,
              '',
              '本 Issue 由自动维护工作流生成，用于提醒维护者关注汉化映射的健康度。',
              '',
              '> ⚠️ 此报告不直接修改 `localization.json`，请人工确认后处理。',
              '',
              '---',
              '',
              report,
              '',
              '---',
              `_由 [GitHubDesktop2Chinese Auto Maintain](https://github.com/${{ github.repository }}/actions/workflows/ghdesktop2chinese-auto-maintain.yml) 自动生成_`,
            ].join('\n');

            // 查找已有同名 open Issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['auto-maintain'],
            });

            const existing = issues.find(i => i.title.startsWith('[自动维护]'));

            if (noFailures) {
              // 全部有效：若存在旧 Issue 则关闭
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                  body: body,
                });
                console.log(`已关闭 Issue #${existing.number}（无失效项）`);
              } else {
                console.log('无失效项且无历史 Issue，无需操作');
              }
              return;
            }

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: title,
                body: body,
              });
              console.log(`已更新 Issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['auto-maintain'],
              });
              console.log(`已创建 Issue #${created.data.number}`);
            }