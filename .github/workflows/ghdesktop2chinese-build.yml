# GitHubDesktop2Chinese 自动构建工作流
# push/PR 时构建 x64/x86 两个架构，并校验 localization.json 质量。
# 支持手动触发，自动运行每周一一次。

name: GitHubDesktop2Chinese Build

on:
  pull_request:
    paths:
      - "GitHubDesktop2Chinese/**"
  push:
    branches: [main]
    paths:
      - "GitHubDesktop2Chinese/**"
  workflow_dispatch: # 手动触发
  schedule:
    - cron: "0 1 * * 1" # 每周一 01:00 UTC 自动构建

concurrency:
  group: ghdesktop2chinese-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  PROJECT_DIR: GitHubDesktop2Chinese

jobs:
  json-check:
    name: 校验 localization.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 校验 JSON 格式
        run: |
          python -c "
          import json, sys
          try:
              with open('${{ env.PROJECT_DIR }}/json/localization.json', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception as e:
              print(f'localization.json 解析失败: {e}')
              sys.exit(1)
          # 校验关键结构
          for key in ['main', 'renderer', 'main_dev', 'renderer_dev']:
              if key not in data:
                  print(f'缺少关键节点: {key}')
                  sys.exit(1)
              if not isinstance(data[key], list):
                  print(f'{key} 应为数组')
                  sys.exit(1)
          print(f'JSON 校验通过: main={len(data[\"main\"])} renderer={len(data[\"renderer\"])} main_dev={len(data[\"main_dev\"])} renderer_dev={len(data[\"renderer_dev\"])}')
          "

  build:
    name: 构建 (x64 + x86)
    needs: json-check
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake (${{ matrix.arch }})
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          if ($env:ARCH -eq 'x64') {
            cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="ci-${{ github.sha }}"
          } else {
            cmake -B build32 -A Win32 -DGitHubActions=1 -DFILE_VERSION="ci-${{ github.sha }}"
          }

      - name: Build (${{ matrix.arch }})
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          if ($env:ARCH -eq 'x64') {
            cmake --build build --config $env:BUILD_TYPE
          } else {
            cmake --build build32 --config $env:BUILD_TYPE
          }

      - name: 重命名 x86 产物
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          if (Test-Path build32/$env:BUILD_TYPE/GitHubDesktop2Chinese.exe) {
            Move-Item build32/$env:BUILD_TYPE/GitHubDesktop2Chinese.exe build32/$env:BUILD_TYPE/GitHubDesktop2Chinese_x86.exe -Force
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GitHubDesktop2Chinese-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ matrix.arch == 'x64' && 'build/Release/GitHubDesktop2Chinese.exe' || 'build32/Release/GitHubDesktop2Chinese_x86.exe' }}