# GitHubDesktop2Chinese 发布工作流
# 推送 tag ghdesktop2chinese-v* 时自动构建并发布 Release。
# 例如: git tag ghdesktop2chinese-v1.2.4 && git push origin ghdesktop2chinese-v1.2.4

name: GitHubDesktop2Chinese Release

on:
  push:
    tags:
      - "ghdesktop2chinese-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀，如 1.2.4）"
        required: true
        type: string

concurrency:
  group: ghdesktop2chinese-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  PROJECT_DIR: GitHubDesktop2Chinese

jobs:
  build:
    name: 构建 x64 + x86
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          # 从 tag 或手动输入解析版本
          $tag = "${{ github.ref_name }}"
          if ($tag -like "ghdesktop2chinese-v*") {
            $version = $tag -replace '^ghdesktop2chinese-v', ''
          } else {
            $version = "${{ github.event.inputs.version }}"
          }
          if (-not $version) { $version = "0.0.0" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          $isPrerelease = if ($version -match 'beta|pre|rc|dev') { "true" } else { "false" }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "is_prerelease=$isPrerelease"
          Write-Host "版本: $version, 预发布: $isPrerelease"

      - name: Configure CMake x64
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="v${{ steps.version.outputs.version }}"

      - name: Build x64
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config $env:BUILD_TYPE

      - name: Configure CMake x86
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build32 -A Win32 -DGitHubActions=1 -DFILE_VERSION="v${{ steps.version.outputs.version }}"

      - name: Build x86
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build32 --config $env:BUILD_TYPE

      - name: 重命名 x86 产物
        shell: pwsh
        run: |
          if (Test-Path build32/$env:BUILD_TYPE/GitHubDesktop2Chinese.exe) {
            Move-Item build32/$env:BUILD_TYPE/GitHubDesktop2Chinese.exe build32/$env:BUILD_TYPE/GitHubDesktop2Chinese_x86.exe -Force
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: GitHubDesktop2Chinese-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            build/${{ env.BUILD_TYPE }}/GitHubDesktop2Chinese.exe
            build32/${{ env.BUILD_TYPE }}/GitHubDesktop2Chinese_x86.exe
            ${{ env.PROJECT_DIR }}/json/localization.json

  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: GitHubDesktop2Chinese-${{ needs.build.outputs.version }}
          path: release/

      - name: 生成 Release 说明
        shell: bash
        run: |
          echo "# GitHubDesktop2Chinese v${{ needs.build.outputs.version }}" > release-notes.md
          echo "" >> release-notes.md
          echo "自动构建产物：" >> release-notes.md
          echo "- \`GitHubDesktop2Chinese.exe\` — 64 位" >> release-notes.md
          echo "- \`GitHubDesktop2Chinese_x86.exe\` — 32 位" >> release-notes.md
          echo "- \`localization.json\` — 汉化映射（最新）" >> release-notes.md
          echo "" >> release-notes.md
          echo "## 使用方法" >> release-notes.md
          echo "1. 下载 \`GitHubDesktop2Chinese.exe\` 双击运行，自动联网获取最新 \`localization.json\` 完成汉化" >> release-notes.md
          echo "2. 或下载 exe 与 \`localization.json\` 放在同一文件夹运行" >> release-notes.md
          echo "3. GitHub Desktop 每次版本更新后需重新运行一次" >> release-notes.md
          echo "" >> release-notes.md
          echo "> ⚠️ 找不到 openssl dll 请升级到本版本；缺失 MSVCP140_ATOMIC_WAIT.dll 请安装 Microsoft Visual C++ Redistributable" >> release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ghdesktop2chinese-v${{ needs.build.outputs.version }}
          name: GitHubDesktop2Chinese v${{ needs.build.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          files: |
            release/GitHubDesktop2Chinese.exe
            release/GitHubDesktop2Chinese_x86.exe
            release/localization.json