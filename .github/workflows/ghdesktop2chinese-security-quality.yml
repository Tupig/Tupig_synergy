# GitHubDesktop2Chinese 安全与质量工作流
# 1) CodeQL 安全扫描 C++ 源码
# 2) localization.json 深度质量校验（结构、重复项、格式）
# 3) 自动维护工具（tools/auto-maintain）自检

name: GitHubDesktop2Chinese Security & Quality

on:
  pull_request:
    paths:
      - "GitHubDesktop2Chinese/**"
  push:
    branches: [main]
    paths:
      - "GitHubDesktop2Chinese/**"
  schedule:
    - cron: "0 6 * * 1" # 每周一 06:00 UTC 定期安全扫描
  workflow_dispatch:

concurrency:
  group: ghdesktop2chinese-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  PROJECT_DIR: GitHubDesktop2Chinese

jobs:
  codeql:
    name: CodeQL 安全扫描
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Configure CMake (x64)
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake -B build -A x64 -DGitHubActions=1 -DFILE_VERSION="codeql"

      - name: Build for CodeQL
        shell: pwsh
        run: |
          chcp 65001 | Out-Null
          cmake --build build --config Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  json-quality:
    name: localization.json 质量校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 深度校验 localization.json
        run: |
          python - <<'PY'
          import json, re, sys

          path = "${{ env.PROJECT_DIR }}/json/localization.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          errors = []
          warnings = []

          # 1) 必要节点
          for key in ["version", "minversion", "main", "renderer", "main_dev", "renderer_dev"]:
              if key not in data:
                  errors.append(f"缺少节点: {key}")

          # 2) 映射项格式：必须是 [查找, 替换] 或 [查找, 替换, 查找参数]
          def check_array(name, arr):
              seen = {}
              for i, item in enumerate(arr):
                  if not isinstance(item, list):
                      errors.append(f"{name}[{i}] 不是数组")
                      continue
                  if len(item) < 2 or len(item) > 3:
                      errors.append(f"{name}[{i}] 长度应为 2 或 3，实际 {len(item)}")
                      continue
                  if not all(isinstance(x, str) for x in item):
                      errors.append(f"{name}[{i}] 含非字符串元素")
                      continue
                  pat = item[0]
                  if not pat:
                      continue
                  # 查找项必须是合法正则
                  try:
                      re.compile(pat)
                  except re.error as e:
                      errors.append(f"{name}[{i}] 非法正则: {pat!r} -> {e}")
                  # 重复检测
                  if pat in seen:
                      warnings.append(f"{name} 重复查找项: {pat!r} (index {seen[pat]} 与 {i})")
                  else:
                      seen[pat] = i

          for key in ["main", "renderer", "main_dev", "renderer_dev"]:
              if isinstance(data.get(key), list):
                  check_array(key, data[key])

          # 3) select 结构
          for si, sel in enumerate(data.get("select", [])):
              if "replaceFile" not in sel:
                  errors.append(f"select[{si}] 缺少 replaceFile")
              if not isinstance(sel.get("replace"), list):
                  errors.append(f"select[{si}] replace 应为数组")

          print(f"映射项统计: main={len(data.get('main', []))} renderer={len(data.get('renderer', []))}")
          if warnings:
              print(f"\n⚠️  {len(warnings)} 个警告:")
              for w in warnings[:20]:
                  print(f"  - {w}")
          if errors:
              print(f"\n❌ {len(errors)} 个错误:")
              for e in errors[:30]:
                  print(f"  - {e}")
              sys.exit(1)
          print("\n✅ localization.json 质量校验通过")
          PY

  tools-test:
    name: 自动维护工具自检
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 语法检查
        working-directory: ${{ env.PROJECT_DIR }}/tools/auto-maintain
        run: |
          for f in src/*.js; do node --check "$f"; done
          echo "所有源文件语法检查通过"

      - name: 单元测试（提取过滤逻辑）
        working-directory: ${{ env.PROJECT_DIR }}/tools/auto-maintain
        run: |
          node --input-type=module -e "
          import { isLikelyUiText } from './src/extract-new.js';
          const cases = [
            ['Do not show this message again', true],
            ['into ', false],
            ['  leading space', false],
            ['h:mm aaa', false],
            ['[object Object]', false],
            ['rgba(255, 255, 255, 0.3)', false],
            ['GitHub Desktop', true],
          ];
          let pass = 0;
          for (const [s, exp] of cases) {
            const got = isLikelyUiText(s);
            if (got !== exp) { console.error('FAIL:', JSON.stringify(s), 'got', got, 'exp', exp); process.exit(1); }
            pass++;
          }
          console.log('单元测试通过:', pass, '/', cases.length);
          "