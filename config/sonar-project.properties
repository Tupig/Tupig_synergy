sonar.projectName=TuPig Synergy
sonar.organization=tupig
sonar.projectKey=tupig_synergy
sonar.sources=src/apps,src/lib
sonar.tests=src/unittests
sonar.exclusions=build/**,translations/**
sonar.coverage.exclusions=src/unittests/**,src/apps/res/**,extra/**,translations/**
sonar.cpd.exclusions=**/*Test*.cpp
sonar.host.url=https://sonarcloud.io
sonar.cfamily.compile-commands=build/compile_commands.json
sonar.python.version=3.10

# Allow use of `new` which is idiomatic for Qt code.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:S5025
sonar.issue.ignore.multicriteria.e1.resourceKey=**
